<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>TETRIS</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #08080f;
      --panel: #0f0f1a;
      --border: #1a1a2e;
      --glow: #00ffcc;
      --glow2: #ff00aa;
      --text: #e0e0ff;
      --muted: #444466;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Press Start 2P', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      padding: 16px 8px 120px;
      touch-action: none;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(0,255,204,0.04) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 50%, rgba(255,0,170,0.04) 0%, transparent 60%);
      pointer-events: none;
    }
    h1 {
      font-size: clamp(16px, 5vw, 28px);
      letter-spacing: 0.3em;
      color: var(--glow);
      text-shadow: 0 0 20px var(--glow);
      margin-bottom: 12px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { text-shadow: 0 0 20px var(--glow); }
      50%      { text-shadow: 0 0 40px var(--glow), 0 0 60px var(--glow); }
    }

    /* LAYOUT PRINCIPAL */
    .game-wrapper {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      position: relative;
      z-index: 1;
    }

    #board {
      border: 2px solid var(--glow);
      box-shadow: 0 0 20px rgba(0,255,204,0.3);
      display: block;
      background: #050510;
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 80px;
    }

    .box {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 8px;
    }

    .box-title { font-size: 5px; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 4px; }
    .box-value { font-size: clamp(8px, 2.5vw, 12px); color: var(--glow); text-shadow: 0 0 8px var(--glow); }
    #level-display { color: var(--glow2); text-shadow: 0 0 8px var(--glow2); }
    #next-canvas { display: block; margin-top: 4px; }

    /* LEADERBOARD */
    .leaderboard {
      margin-top: 16px;
      width: 100%;
      max-width: 400px;
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 14px;
      position: relative;
      z-index: 1;
    }
    .lb-title { font-size: 8px; color: var(--glow2); text-shadow: 0 0 10px var(--glow2); letter-spacing: 0.15em; margin-bottom: 12px; text-align: center; }
    .lb-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 7px; }
    .lb-row:last-child { border-bottom: none; }
    .lb-rank { width: 20px; color: var(--muted); text-align: center; flex-shrink: 0; }
    .lb-rank.gold   { color: #ffd700; text-shadow: 0 0 8px #ffd700; }
    .lb-rank.silver { color: #c0c0c0; }
    .lb-rank.bronze { color: #cd7f32; }
    .lb-name  { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-score { color: var(--glow); text-shadow: 0 0 6px var(--glow); flex-shrink: 0; }
    .lb-empty { font-size: 6px; color: var(--muted); text-align: center; padding: 12px 0; }

    /* CONTROLES TÁCTILES */
    .touch-controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px 16px;
      background: linear-gradient(transparent, rgba(8,8,15,0.95));
      z-index: 100;
      gap: 8px;
    }

    .touch-group {
      display: flex;
      gap: 8px;
    }

    .touch-btn {
      width: 56px;
      height: 56px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--glow);
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 4px;
      user-select: none;
      transition: background 0.1s, border-color 0.1s;
      -webkit-user-select: none;
    }

    .touch-btn:active, .touch-btn.pressed {
      background: rgba(0,255,204,0.15);
      border-color: var(--glow);
    }

    .touch-btn.btn-drop {
      width: 56px;
      color: var(--glow2);
      border-color: var(--glow2);
      font-size: 14px;
    }
    .touch-btn.btn-drop:active { background: rgba(255,0,170,0.15); }

    .touch-btn.btn-rotate {
      color: #ffdd00;
      border-color: #ffdd00;
    }
    .touch-btn.btn-rotate:active { background: rgba(255,221,0,0.15); }

    /* OVERLAY */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(8,8,15,0.93);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 200;
      padding: 20px;
    }
    #overlay h2 { font-size: clamp(14px, 4vw, 20px); color: var(--glow2); text-shadow: 0 0 20px var(--glow2); letter-spacing: 0.2em; text-align: center; }
    #overlay p  { font-size: 7px; color: var(--muted); letter-spacing: 0.1em; text-align: center; }
    .score-display { font-size: clamp(10px, 3vw, 14px); color: var(--glow); }

    #btn-start {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(8px, 2.5vw, 11px);
      padding: 14px 28px;
      background: transparent;
      border: 2px solid var(--glow);
      color: var(--glow);
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: all 0.15s;
    }
    #btn-start:active { background: var(--glow); color: var(--bg); }

    .name-form { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 280px; }
    .name-form label { font-size: 6px; color: var(--muted); letter-spacing: 0.15em; }
    #name-input {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      padding: 10px 16px;
      background: var(--panel);
      border: 1px solid var(--glow);
      color: var(--glow);
      text-align: center;
      outline: none;
      width: 100%;
    }
    #name-input::placeholder { color: var(--muted); }
    #btn-submit {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      padding: 10px 20px;
      background: transparent;
      border: 1px solid var(--glow2);
      color: var(--glow2);
      cursor: pointer;
      transition: all 0.15s;
    }
    #btn-submit:active { background: var(--glow2); color: var(--bg); }

    .back-link {
      position: fixed;
      top: 12px; left: 12px;
      font-size: 7px;
      color: var(--muted);
      text-decoration: none;
      z-index: 300;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

<a href="index.html" class="back-link">← VOLVER</a>
<h1>TETRIS</h1>

<div class="game-wrapper">
  <canvas id="board"></canvas>
  <div class="panel">
    <div class="box"><div class="box-title">SCORE</div><div class="box-value" id="score-display">0</div></div>
    <div class="box"><div class="box-title">NIVEL</div><div class="box-value" id="level-display">1</div></div>
    <div class="box"><div class="box-title">LINEAS</div><div class="box-value" id="lines-display">0</div></div>
    <div class="box"><div class="box-title">NEXT</div><canvas id="next-canvas" width="64" height="64"></canvas></div>
  </div>
</div>

<div class="leaderboard">
  <div class="lb-title">🏆 LEADERBOARD GLOBAL</div>
  <div id="lb-list"><div class="lb-empty">Cargando...</div></div>
</div>

<!-- Controles táctiles -->
<div class="touch-controls" id="touch-controls" style="display:none">
  <div class="touch-group">
    <div class="touch-btn" id="btn-left">◀</div>
    <div class="touch-btn" id="btn-right">▶</div>
  </div>
  <div class="touch-group">
    <div class="touch-btn btn-rotate" id="btn-rotate">↻</div>
    <div class="touch-btn" id="btn-down">▼</div>
    <div class="touch-btn btn-drop" id="btn-drop">DROP</div>
  </div>
</div>

<!-- Overlay -->
<div id="overlay">
  <h2 id="overlay-title">TETRIS</h2>
  <p id="overlay-sub">TOCÁ PARA EMPEZAR</p>
  <div class="score-display" id="overlay-score"></div>
  <div id="name-section" style="display:none" class="name-form">
    <label>TU NOMBRE</label>
    <input id="name-input" maxlength="12" placeholder="JUGADOR" autocomplete="off"/>
    <button id="btn-submit">GUARDAR</button>
  </div>
  <button id="btn-start">JUGAR</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, push, query, orderByChild, limitToLast, onValue }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDV0VHMK9fhCV72yJ2inExEsO9toACGm78",
    authDomain: "leaderboartetrisproyect.firebaseapp.com",
    databaseURL: "https://leaderboartetrisproyect-default-rtdb.firebaseio.com",
    projectId: "leaderboartetrisproyect",
    storageBucket: "leaderboartetrisproyect.firebasestorage.app",
    messagingSenderId: "1039894129114",
    appId: "1:1039894129114:web:2d36c3734154acd8d3f8e3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const scoresRef = ref(db, 'scores');

  // Tamaño adaptable
  const isMobile = window.innerWidth < 600;
  const BLOCK = isMobile ? Math.floor((window.innerWidth - 120) / 12) : 20;
  const COLS = 12, ROWS = 24;

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const nextCanvas = document.getElementById('next-canvas');
  const nctx = nextCanvas.getContext('2d');
  canvas.width = COLS * BLOCK;
  canvas.height = ROWS * BLOCK;

  // Mostrar controles táctiles en móvil
  if (isMobile) document.getElementById('touch-controls').style.display = 'flex';

  const COLORS = [null,'#00ffcc','#ff00aa','#ffdd00','#00aaff','#ff6600','#aa00ff','#00ff66'];
  const PIECES = [
    null,
    [[1,1,1,1]],
    [[2,2],[2,2]],
    [[0,3,0],[3,3,3]],
    [[0,4,4],[4,4,0]],
    [[5,5,0],[0,5,5]],
    [[6,0,0],[6,6,6]],
    [[0,0,7],[7,7,7]],
  ];

  let board, score, lines, level, dropInterval, lastTime, animId;
  let current, currentX, currentY, nextPiece;
  let paused = false, gameOver = false, started = false;

  const createBoard = () => Array.from({length: ROWS}, () => Array(COLS).fill(0));
  const randomPiece = () => { const id = Math.floor(Math.random()*7)+1; return {id, shape: PIECES[id].map(r=>[...r])}; };

  function rotate(shape) {
    const rows = shape.length, cols = shape[0].length;
    const r = Array.from({length: cols}, () => Array(rows).fill(0));
    for (let i=0;i<rows;i++) for (let j=0;j<cols;j++) r[j][rows-1-i]=shape[i][j];
    return r;
  }

  function collides(shape, ox, oy) {
    for (let r=0;r<shape.length;r++)
      for (let c=0;c<shape[r].length;c++)
        if (shape[r][c]) {
          const nx=ox+c, ny=oy+r;
          if (nx<0||nx>=COLS||ny>=ROWS) return true;
          if (ny>=0&&board[ny][nx]) return true;
        }
    return false;
  }

  function place() {
    for (let r=0;r<current.shape.length;r++)
      for (let c=0;c<current.shape[r].length;c++)
        if (current.shape[r][c]) {
          if (currentY+r<0) { endGame(); return; }
          board[currentY+r][currentX+c]=current.id;
        }
    clearLines(); spawn();
  }

  function clearLines() {
    let cleared=0;
    for (let r=ROWS-1;r>=0;r--) {
      if (board[r].every(c=>c!==0)) { board.splice(r,1); board.unshift(Array(COLS).fill(0)); cleared++; r++; }
    }
    if (cleared) {
      const pts=[0,100,300,500,800];
      score+=(pts[cleared]||800)*level;
      lines+=cleared; level=Math.floor(lines/10)+1;
      dropInterval=Math.max(100,1000-(level-1)*90);
      updateUI();
    }
  }

  function spawn() {
    current=nextPiece; nextPiece=randomPiece();
    currentX=Math.floor(COLS/2)-Math.floor(current.shape[0].length/2);
    currentY=-current.shape.length+1;
    if (collides(current.shape,currentX,currentY+1)) endGame();
    drawNext();
  }

  const hardDrop = () => { while(!collides(current.shape,currentX,currentY+1)) currentY++; place(); };
  const updateUI = () => {
    document.getElementById('score-display').textContent=score;
    document.getElementById('level-display').textContent=level;
    document.getElementById('lines-display').textContent=lines;
  };

  function drawBlock(context, x, y, colorId, alpha=1, bk=BLOCK) {
    context.globalAlpha=alpha;
    context.fillStyle=COLORS[colorId];
    context.fillRect(x*bk+1, y*bk+1, bk-2, bk-2);
    context.fillStyle='rgba(255,255,255,0.18)';
    context.fillRect(x*bk+2, y*bk+2, bk-4, 3);
    context.globalAlpha=1;
  }

  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle='rgba(255,255,255,0.03)'; ctx.lineWidth=1;
    for (let c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(c*BLOCK,0);ctx.lineTo(c*BLOCK,canvas.height);ctx.stroke();}
    for (let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(0,r*BLOCK);ctx.lineTo(canvas.width,r*BLOCK);ctx.stroke();}
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) if(board[r][c]) drawBlock(ctx,c,r,board[r][c]);
    if (current) {
      let gy=currentY; while(!collides(current.shape,currentX,gy+1)) gy++;
      for (let r=0;r<current.shape.length;r++) for (let c=0;c<current.shape[r].length;c++) if(current.shape[r][c]&&gy+r>=0) drawBlock(ctx,currentX+c,gy+r,current.id,0.15);
      for (let r=0;r<current.shape.length;r++) for (let c=0;c<current.shape[r].length;c++) if(current.shape[r][c]&&currentY+r>=0) drawBlock(ctx,currentX+c,currentY+r,current.id);
    }
  }

  function drawNext() {
    nctx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
    const shape=nextPiece.shape, bk=13;
    const offX=Math.floor((nextCanvas.width/bk-shape[0].length)/2);
    const offY=Math.floor((nextCanvas.height/bk-shape.length)/2);
    for (let r=0;r<shape.length;r++) for (let c=0;c<shape[r].length;c++) if(shape[r][c]) {
      nctx.fillStyle=COLORS[shape[r][c]]; nctx.fillRect((offX+c)*bk+1,(offY+r)*bk+1,bk-2,bk-2);
      nctx.fillStyle='rgba(255,255,255,0.18)'; nctx.fillRect((offX+c)*bk+2,(offY+r)*bk+2,bk-4,2);
    }
  }

  function gameLoop(ts=0) {
    if (!started||paused||gameOver) return;
    if (ts-lastTime>dropInterval) {
      lastTime=ts;
      if (!collides(current.shape,currentX,currentY+1)) currentY++; else place();
    }
    draw(); animId=requestAnimationFrame(gameLoop);
  }

  function startGame() {
    board=createBoard(); score=0; lines=0; level=1; dropInterval=1000;
    lastTime=0; paused=false; gameOver=false; started=true;
    nextPiece=randomPiece(); spawn(); updateUI();
    document.getElementById('overlay').style.display='none';
    document.getElementById('name-section').style.display='none';
    document.getElementById('overlay-score').textContent='';
    cancelAnimationFrame(animId);
    animId=requestAnimationFrame(gameLoop);
  }

  function endGame() {
    gameOver=true; draw();
    document.getElementById('overlay-title').textContent='GAME OVER';
    document.getElementById('overlay-sub').textContent='PUNTAJE FINAL';
    document.getElementById('overlay-score').textContent=score;
    document.getElementById('name-section').style.display='flex';
    document.getElementById('btn-start').textContent='REINTENTAR';
    document.getElementById('overlay').style.display='flex';
  }

  // ── FIREBASE ───────────────────────────────────────────────
  document.getElementById('btn-submit').addEventListener('click', async () => {
    const nameInput=document.getElementById('name-input');
    const name=nameInput.value.trim()||'ANÓNIMO';
    await push(scoresRef,{name:name.toUpperCase(),score,date:Date.now()});
    document.getElementById('name-section').style.display='none';
    nameInput.value='';
  });

  const topQuery=query(scoresRef,orderByChild('score'),limitToLast(10));
  onValue(topQuery,(snapshot)=>{
    const list=document.getElementById('lb-list');
    const entries=[];
    snapshot.forEach(child=>entries.push(child.val()));
    entries.sort((a,b)=>b.score-a.score);
    if (!entries.length) { list.innerHTML='<div class="lb-empty">SIN PUNTAJES AÚN</div>'; return; }
    const rankLabels=['🥇','🥈','🥉'];
    const rankClasses=['gold','silver','bronze'];
    list.innerHTML=entries.map((e,i)=>`
      <div class="lb-row">
        <div class="lb-rank ${rankClasses[i]||''}">${rankLabels[i]||(i+1)}</div>
        <div class="lb-name">${e.name}</div>
        <div class="lb-score">${e.score.toLocaleString()}</div>
      </div>`).join('');
  });

  // ── TECLADO ────────────────────────────────────────────────
  document.addEventListener('keydown', e=>{
    if (!started||gameOver) return;
    if (e.key==='p'||e.key==='P') { paused=!paused; if(!paused){lastTime=performance.now();animId=requestAnimationFrame(gameLoop);} return; }
    if (paused) return;
    switch(e.key) {
      case 'ArrowLeft':  if(!collides(current.shape,currentX-1,currentY)) currentX--; break;
      case 'ArrowRight': if(!collides(current.shape,currentX+1,currentY)) currentX++; break;
      case 'ArrowDown':  if(!collides(current.shape,currentX,currentY+1)) currentY++; else place(); break;
      case 'ArrowUp': { const rot=rotate(current.shape); if(!collides(rot,currentX,currentY)) current.shape=rot; break; }
      case ' ': e.preventDefault(); hardDrop(); break;
    }
    draw();
  });

  // ── CONTROLES TÁCTILES ─────────────────────────────────────
  function addTouchBtn(id, action) {
    const btn = document.getElementById(id);
    if (!btn) return;

    let interval = null;
    const isRepeat = ['btn-left','btn-right','btn-down'].includes(id);

    const start = (e) => {
      e.preventDefault();
      if (!started || gameOver || paused) return;
      btn.classList.add('pressed');
      action();
      draw();
      if (isRepeat) {
        interval = setInterval(() => { if (!paused && !gameOver) { action(); draw(); } }, 120);
      }
    };

    const end = (e) => {
      e.preventDefault();
      btn.classList.remove('pressed');
      if (interval) { clearInterval(interval); interval = null; }
    };

    btn.addEventListener('touchstart', start, { passive: false });
    btn.addEventListener('touchend', end, { passive: false });
    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup', end);
  }

  addTouchBtn('btn-left',   () => { if(!collides(current.shape,currentX-1,currentY)) currentX--; });
  addTouchBtn('btn-right',  () => { if(!collides(current.shape,currentX+1,currentY)) currentX++; });
  addTouchBtn('btn-down',   () => { if(!collides(current.shape,currentX,currentY+1)) currentY++; else place(); });
  addTouchBtn('btn-rotate', () => { const rot=rotate(current.shape); if(!collides(rot,currentX,currentY)) current.shape=rot; });
  addTouchBtn('btn-drop',   () => hardDrop());

  // ── SWIPE ──────────────────────────────────────────────────
  let touchStartX=0, touchStartY=0;
  canvas.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  canvas.addEventListener('touchend', e => {
    if (!started || gameOver || paused) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
      const rot = rotate(current.shape);
      if (!collides(rot, currentX, currentY)) current.shape = rot;
      draw();
    }
  }, { passive: true });

  document.getElementById('btn-start').addEventListener('click', startGame);
  board=createBoard(); draw();
</script>
</body>
</html>
